apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-rush
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ticket-rush
  template:
    metadata:
      labels:
        app: ticket-rush
    spec:
      containers:
        - name: ticket-rush
          image: ticket-rush:v5
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: RESERVATION_MODE
              value: "redis"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: CPU_MODE
              value: "worker"
            - name: MAX_WORKERS
              value: "2"

